version: 2

# The workflows here pin every action to a commit SHA, which is the right thing
# to do and also a way to sit on a known-vulnerable version forever: a pin does
# not update itself, and nothing about a stale SHA looks wrong. Dependabot is
# what keeps the pin current — it rewrites the SHA and the `# vX.Y.Z` comment
# beside it, so the pin stays honest without anyone remembering to check.
#
# Nothing else here has a dependency manifest. The RPM sources are pinned by
# checksum in packages/*/sources.sha256 and bumped deliberately on an upstream
# release; the Rust dependency tree belongs to upstream's Cargo.lock, which this
# repository packages rather than manages.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
